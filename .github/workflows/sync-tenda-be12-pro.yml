name: Sync Tenda BE12 Pro

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream x-wrt/x-wrt tag. Leave empty to use the latest release tag.'
        required: false
        type: string
  schedule:
    - cron: '05 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-tenda-be12-pro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Tenda BE12 Pro branch
      uses: actions/checkout@v6
      with:
        ref: tenda-be12-pro
        fetch-depth: 0
        fetch-tags: false
        filter: blob:none

    - name: Sync upstream release tag
      id: sync
      env:
        REQUESTED_TAG: ${{ inputs.upstream_tag }}
      run: |
        set -eu

        git remote add upstream https://github.com/x-wrt/x-wrt.git 2>/dev/null || \
          git remote set-url upstream https://github.com/x-wrt/x-wrt.git

        if [ -n "${REQUESTED_TAG}" ]; then
          upstream_tag="${REQUESTED_TAG}"
        else
          upstream_tag="$(
            git ls-remote --tags --refs https://github.com/x-wrt/x-wrt.git |
            awk -F/ '{print $3}' |
            grep -E '^[0-9]+[.][0-9]+_b[0-9]{12}$' |
            sort -V |
            tail -n 1
          )"
        fi

        echo "${upstream_tag}" | grep -Eq '^[0-9]+[.][0-9]+_b[0-9]{12}$'

        echo "release_tag=${upstream_tag}" >>"${GITHUB_OUTPUT}"

        if git ls-remote --exit-code --tags origin "refs/tags/${upstream_tag}" >/dev/null 2>&1; then
          echo "changed=false" >>"${GITHUB_OUTPUT}"
          echo "NICOLE1224/x-wrt already has tag ${upstream_tag}."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch --no-tags --filter=blob:none upstream \
          "refs/tags/${upstream_tag}:refs/tags/upstream/${upstream_tag}"

        if ! git merge --no-edit "refs/tags/upstream/${upstream_tag}"; then
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "${conflicts}" != "feeds.conf.default" ]; then
            printf '%s\n' "${conflicts}"
            exit 1
          fi

          git checkout --theirs feeds.conf.default
          git add feeds.conf.default
          git commit --no-edit
        fi

        sed -i \
          's#^src-git x .*#src-git x https://github.com/NICOLE1224/com.x-wrt.git;tenda-be12-pro#' \
          feeds.conf.default

        grep -qx \
          'src-git x https://github.com/NICOLE1224/com.x-wrt.git;tenda-be12-pro' \
          feeds.conf.default

        if ! git diff --quiet -- feeds.conf.default; then
          git add feeds.conf.default
          git commit -s -m "feeds: use BE12 Pro custom feed for ${upstream_tag}"
        fi

        git tag -a "${upstream_tag}" -m "X-WRT BE12 Pro ${upstream_tag}"
        git push origin HEAD:tenda-be12-pro
        git push origin "refs/tags/${upstream_tag}"

        echo "changed=true" >>"${GITHUB_OUTPUT}"
