name: Sync Tenda BE12 Pro

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream x-wrt/x-wrt tag. Leave empty to use the latest release tag.'
        required: false
        type: string
  schedule:
    - cron: '05 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-tenda-be12-pro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Tenda BE12 Pro branch
      uses: actions/checkout@v6
      with:
        ref: tenda-be12-pro
        fetch-depth: 0
        fetch-tags: false

    - name: Sync upstream release tag
      id: sync
      env:
        REQUESTED_TAG: ${{ inputs.upstream_tag }}
      run: |
        set -eu

        git remote add upstream https://github.com/x-wrt/x-wrt.git 2>/dev/null || \
          git remote set-url upstream https://github.com/x-wrt/x-wrt.git

        if [ -n "${REQUESTED_TAG}" ]; then
          upstream_tag="${REQUESTED_TAG}"
        else
          upstream_tag="$(
            git ls-remote --tags --refs https://github.com/x-wrt/x-wrt.git |
            awk -F/ '{print $3}' |
            grep -E '^[0-9]+[.][0-9]+_b[0-9]{12}$' |
            sort -V |
            tail -n 1
          )"
        fi

        echo "${upstream_tag}" | grep -Eq '^[0-9]+[.][0-9]+_b[0-9]{12}$'

        echo "release_tag=${upstream_tag}" >>"${GITHUB_OUTPUT}"

        if git ls-remote --exit-code --tags origin "refs/tags/${upstream_tag}" >/dev/null 2>&1; then
          echo "changed=false" >>"${GITHUB_OUTPUT}"
          echo "NICOLE1224/x-wrt already has tag ${upstream_tag}."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch --no-tags upstream \
          "refs/tags/${upstream_tag}:refs/tags/upstream/${upstream_tag}"

        current_head="$(git rev-parse HEAD)"
        upstream_commit="$(git rev-parse "refs/tags/upstream/${upstream_tag}^{commit}")"
        workflow_path='.github/workflows/sync-tenda-be12-pro.yml'

        # Rebuild from the exact upstream tree, then restore the two owned overlays.
        git read-tree --reset -u "${upstream_commit}"
        git checkout "${current_head}" -- "${workflow_path}"

        sed -i \
          's#^src-git x .*#src-git x https://github.com/NICOLE1224/com.x-wrt.git;tenda-be12-pro#' \
          feeds.conf.default

        grep -qx \
          'src-git x https://github.com/NICOLE1224/com.x-wrt.git;tenda-be12-pro' \
          feeds.conf.default

        git add "${workflow_path}" feeds.conf.default
        git diff --quiet
        git diff --cached --check "${upstream_commit}" -- \
          "${workflow_path}" feeds.conf.default

        while IFS= read -r changed_path; do
          case "${changed_path}" in
            "${workflow_path}"|feeds.conf.default|'') ;;
            *)
              echo "Unexpected fork-owned path: ${changed_path}"
              exit 1
              ;;
          esac
        done <<EOF
        $(git diff --cached --name-only "${upstream_commit}")
        EOF

        tree="$(git write-tree)"
        merge_commit="$(
          printf 'sync: import upstream %s\n' "${upstream_tag}" |
            git commit-tree "${tree}" -p "${current_head}" -p "${upstream_commit}"
        )"
        git reset --hard "${merge_commit}"

        git tag -a "${upstream_tag}" -m "X-WRT BE12 Pro ${upstream_tag}"
        git push origin HEAD:tenda-be12-pro
        git push origin "refs/tags/${upstream_tag}"

        echo "changed=true" >>"${GITHUB_OUTPUT}"
